name: Release firmware

on:
  workflow_run:
    workflows: ["Verify firmware"]
    types: [completed]
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and verify tested firmware
        run: |
          python3 tools/generate_firmware.py \
            panels/dfrobot,unihiker-m10-display/commands.txt \
            dist/dfrobot,unihiker-m10-display.bin
          cmp panels/dfrobot,unihiker-m10-display/dfrobot,unihiker-m10-display.bin \
            dist/dfrobot,unihiker-m10-display.bin
          cd dist
          sha256sum -c ../panels/dfrobot,unihiker-m10-display/SHA256SUMS
          cp ../panels/dfrobot,unihiker-m10-display/SHA256SUMS SHA256SUMS
          tar -czf dfrobot-unihiker-m10-display.tar.gz \
            dfrobot,unihiker-m10-display.bin SHA256SUMS
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Publish first release after successful main CI
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v1.0.0 already exists; no changes made.'
            exit 0
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.0 >/dev/null; then
            echo 'v1.0.0 tag exists without a Release; manual review needed.'
            exit 1
          fi
          gh release create v1.0.0 \
            dist/dfrobot,unihiker-m10-display.bin \
            dist/SHA256SUMS \
            dist/dfrobot-unihiker-m10-display.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "v1.0.0" \
            --notes-file releases/v1.0.0.md
      - name: Publish a new tagged version
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace files.'
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/dfrobot,unihiker-m10-display.bin \
            dist/SHA256SUMS \
            dist/dfrobot-unihiker-m10-display.tar.gz \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
