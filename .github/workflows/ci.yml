name: Verify firmware

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Generate firmware
        run: |
          python3 tools/generate_firmware.py \
            panels/dfrobot,unihiker-m10-display/commands.txt \
            dist/dfrobot,unihiker-m10-display.bin
      - name: Compare tested binary and checksum
        run: |
          cmp panels/dfrobot,unihiker-m10-display/dfrobot,unihiker-m10-display.bin \
            dist/dfrobot,unihiker-m10-display.bin
          (cd dist && sha256sum -c ../panels/dfrobot,unihiker-m10-display/SHA256SUMS)
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
